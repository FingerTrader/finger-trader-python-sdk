{
  "name": "Quant contracts",
  "on": {
    "pull_request": null,
    "push": null,
    "merge_group": null,
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "quant-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "quant-quality": {
      "name": "quant-quality",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout candidate",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Fixed Python",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.12.14",
            "check-latest": false
          }
        },
        {
          "name": "Fixed Dart",
          "uses": "dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d",
          "with": {
            "sdk": "3.6.0"
          }
        },
        {
          "name": "Required P0 checks",
          "run": "python -B tools/quant/quality.py --dart \"$(command -v dart)\" --report-dir \"$RUNNER_TEMP/quant-p0\""
        },
        {
          "name": "Required evidence",
          "if": "always()",
          "run": "python -B tools/quant/report_summary.py \"$RUNNER_TEMP/quant-p0/report.json\" \"$GITHUB_STEP_SUMMARY\""
        }
      ]
    }
  }
}
