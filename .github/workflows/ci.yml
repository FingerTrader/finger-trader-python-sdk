name: SDK CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,websocket]"
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m build
      - name: Audit resolved third-party dependencies
        run: |
          python -m pip freeze | grep -v -E '^(finger-trader-sdk(@|==)|-e .*finger-trader-python-sdk)' > /tmp/requirements-audit.txt
          pip-audit --strict -r /tmp/requirements-audit.txt

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
