[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "finger-trader-sdk"
version = "0.1.0"
description = "Python SDK for the Finger Trader APIs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Finger Trader" }]
keywords = ["trading", "quantitative-finance", "strategy", "market-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.optional-dependencies]
websocket = ["websocket-client>=1.8,<1.9"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.11,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/finger_trader"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finger_trader.hosted" = ["*.json"]
